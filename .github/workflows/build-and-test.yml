name: Build and Test
on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Java 25 is required: the DAVE voice library (jdave) uses the stable Foreign Function & Memory API
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: JMusicBot-jar
          path: target/JMusicBot-*-All.jar
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: jmusicbot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and the DAVE native library loads
        run: |
          test "$(docker run --rm --entrypoint id jmusicbot:ci -u)" = "10001"
          # an invalid token makes the bot exit after startup; we only assert that startup reached the DAVE check
          docker run --rm -e JMUSICBOT_TOKEN=invalid -e JMUSICBOT_OWNER=1 jmusicbot:ci 2>&1 | tee out.log || true
          grep -q "DAVE (Discord end-to-end encrypted voice) support loaded" out.log
