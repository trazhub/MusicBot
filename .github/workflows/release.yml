name: Release
# Push a tag such as v0.5.0 (or run manually) to publish a GitHub release with the jar and checksums,
# plus a multi-arch (amd64/arm64) image on GHCR.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the leading v (e.g. 0.5.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      packages: write     # push to ghcr.io
    env:
      RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Compute version
        id: v
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
      - name: Set project version, build and test
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn --batch-mode --no-transfer-progress verify
          cp "target/JMusicBot-$VERSION-All.jar" "JMusicBot-$VERSION.jar"
          sha256sum "JMusicBot-$VERSION.jar" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: |
            JMusicBot-${{ steps.v.outputs.version }}.jar
            SHA256SUMS.txt
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
