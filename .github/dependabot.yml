version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      jda-stack:
        patterns: ["net.dv8tion:*", "club.minnced:*", "pw.chew:*"]
      audio-stack:
        patterns: ["dev.arbjerg:*", "dev.lavalink.youtube:*"]
      maven-plugins:
        patterns: ["org.apache.maven.plugins:*"]
      test:
        patterns: ["org.junit*", "org.mockito:*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
